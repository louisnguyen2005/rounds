---
- name: Triển khai Meko Boutique độc lập cho từng đội
  hosts: 'team1:team2:team3'
  become: true
  gather_facts: true
  vars:
    meko_team_vnc_passwords:
      team1: "{{ lookup('ansible.builtin.env', 'MEKO_TEAM1_VNC_PASSWORD') }}"
      team2: "{{ lookup('ansible.builtin.env', 'MEKO_TEAM2_VNC_PASSWORD') }}"
      team3: "{{ lookup('ansible.builtin.env', 'MEKO_TEAM3_VNC_PASSWORD') }}"
    meko_desktop_enabled: "{{ (meko_team_vnc_passwords.values() | reject('equalto', '') | list | length) > 0 }}"
  pre_tasks:
    - name: Kiểm tra cấu hình mật khẩu cố định trước khi triển khai
      ansible.builtin.assert:
        that:
          - meko_team_passwords is mapping
          - (meko_team_passwords.keys() | list | sort) == (meko_addresses.keys() | list | sort)
          - (meko_team_passwords.values() | select('string') | list | length) == (meko_addresses | length)
          - (meko_team_passwords.values() | select('match', '^[ -~]{8,}\\Z') | list | length) == (meko_addresses | length)
          - (meko_team_passwords.values() | unique(case_sensitive=true) | list | length) == (meko_addresses | length)
          - meko_staff_secret is string and (meko_staff_secret | length) >= 16
        fail_msg: Kiểm tra ba mật khẩu SSH của đội và khóa staff trong provisioning/group_vars/all.yml.
        quiet: true
      run_once: true

    - name: Kiểm tra mật khẩu VNC khi cấu hình Open GUI
      ansible.builtin.assert:
        that:
          - meko_team_vnc_passwords is mapping
          - (meko_team_vnc_passwords.keys() | list | sort) == (meko_addresses.keys() | list | sort)
          - (meko_team_vnc_passwords.values() | select('string') | list | length) == (meko_addresses | length)
          - (meko_team_vnc_passwords.values() | select('match', '^[A-Za-z0-9]{8}\\Z') | list | length) == (meko_addresses | length)
          - (meko_team_vnc_passwords.values() | unique(case_sensitive=true) | list | length) == (meko_addresses | length)
        fail_msg: Open GUI cần mật khẩu VNC riêng gồm tám chữ cái hoặc chữ số cho mỗi đội.
        quiet: true
      run_once: true
      when: meko_desktop_enabled | bool

    - name: Cấu hình tài khoản đội, khóa kali và bật SSH password
      ansible.builtin.include_tasks: trainee-access.yml
    - name: Áp dụng cấu hình SSH trước khi triển khai web
      ansible.builtin.meta: flush_handlers

  tasks:
    - name: Cài Apache và runtime ứng dụng
      ansible.builtin.apt:
        name: [apache2, libapache2-mod-evasive, python3-flask, python3-waitress, sudo]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Giảm ảnh hưởng SYN flood và tắt ping echo trên VM đội
      ansible.posix.sysctl:
        name: '{{ item.name }}'
        value: '{{ item.value }}'
        state: present
        sysctl_set: true
        reload: true
      loop:
        - {name: net.ipv4.tcp_syncookies, value: '1'}
        - {name: net.ipv4.tcp_max_syn_backlog, value: '4096'}
        - {name: net.ipv4.tcp_synack_retries, value: '3'}
        - {name: net.ipv4.tcp_fin_timeout, value: '15'}
        - {name: net.core.somaxconn, value: '1024'}
        - {name: net.ipv4.icmp_echo_ignore_all, value: '1'}
        - {name: net.ipv4.icmp_echo_ignore_broadcasts, value: '1'}

    - name: Cấu hình hạn mức yêu cầu HTTP theo IP
      ansible.builtin.copy:
        dest: /etc/apache2/conf-available/meko-evasive.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <IfModule mod_evasive20.c>
            DOSHashTableSize 3097
            DOSPageCount 30
            DOSSiteCount 150
            DOSPageInterval 1
            DOSSiteInterval 1
            DOSBlockingPeriod 10
          </IfModule>
          <IfModule reqtimeout_module>
            RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
          </IfModule>
      notify: Reload Apache

    - name: Tạo drop-in giới hạn tài nguyên Apache
      ansible.builtin.file:
        path: /etc/systemd/system/apache2.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Đặt giới hạn CPU, RAM, tiến trình và file descriptor cho Apache
      ansible.builtin.copy:
        dest: /etc/systemd/system/apache2.service.d/meko-limits.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          CPUQuota=25%
          MemoryMax=256M
          MemorySwapMax=0
          TasksMax=64
          LimitNOFILE=256
      notify: Restart Apache

    - name: Đảm bảo thư mục log của Apache tồn tại
      ansible.builtin.file:
        path: /var/log/apache2
        state: directory
        owner: root
        group: adm
        mode: '0750'

    - name: Tạo tài khoản dịch vụ hạn chế
      ansible.builtin.user:
        name: meko-web
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Tạo thư mục cấu hình được bảo vệ
      ansible.builtin.file:
        path: /etc/meko-boutique
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Chép mã nguồn ứng dụng lên VM
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../app/'
        dest: /opt/meko-boutique/
        owner: '{{ inventory_hostname }}'
        group: users
        mode: 'u=rwX,go=rX'
      notify: Restart Meko Boutique

    - name: Tạo thư mục dữ liệu bền vững cho dịch vụ
      ansible.builtin.file:
        path: /var/lib/meko-boutique
        state: directory
        owner: meko-web
        group: meko-web
        mode: '0700'

    - name: Ghi mật khẩu nhân viên (cấu hình sẵn) cho khu vận hành
      ansible.builtin.copy:
        dest: /etc/meko-boutique/staff.env
        owner: root
        group: root
        mode: '0600'
        content: "MEKO_STAFF_PASSWORD={{ (meko_staff_secret ~ ':' ~ inventory_hostname) | hash('sha256') }}\n"
      no_log: true
      notify: Restart Meko Boutique

    - name: Cho đội restart đúng dịch vụ của mình sau khi vá source
      ansible.builtin.copy:
        dest: /etc/sudoers.d/meko-team-service
        owner: root
        group: root
        mode: '0440'
        content: "{{ inventory_hostname }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart meko-boutique.service\n"
        validate: '/usr/sbin/visudo -cf %s'

    - name: Tạo systemd service cho ứng dụng
      ansible.builtin.copy:
        dest: /etc/systemd/system/meko-boutique.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Meko Boutique training shop
          After=network.target
          StartLimitIntervalSec=60
          StartLimitBurst=5
          [Service]
          User=meko-web
          Group=meko-web
          WorkingDirectory=/opt/meko-boutique
          Environment=TEAM_ID={{ inventory_hostname }}
          Environment=MEKO_DATA=/var/lib/meko-boutique
          Environment=HOST=127.0.0.1
          Environment=PORT=8080
          EnvironmentFile=/etc/meko-boutique/staff.env
          ExecStart=/usr/bin/python3 /opt/meko-boutique/app.py
          Restart=on-failure
          RestartSec=2
          CPUQuota=50%
          MemoryMax=512M
          MemorySwapMax=0
          TasksMax=48
          LimitNOFILE=128
          LimitFSIZE=128M
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/meko-boutique
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          LockPersonality=true
          [Install]
          WantedBy=multi-user.target
      notify: Restart Meko Boutique

    - name: Cấu hình Apache reverse proxy (cổng 80 -> 127.0.0.1:8080)
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/000-meko-boutique.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:80>
            ServerName {{ meko_addresses[inventory_hostname] }}
            ProxyPreserveHost On
            ProxyPass / http://127.0.0.1:8080/
            ProxyPassReverse / http://127.0.0.1:8080/
            ErrorLog ${APACHE_LOG_DIR}/meko-error.log
            CustomLog ${APACHE_LOG_DIR}/meko-access.log combined
          </VirtualHost>

    - name: Giới hạn worker Apache trên VM đội
      ansible.builtin.copy:
        dest: /etc/apache2/conf-available/meko-limits.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <IfModule mpm_event_module>
            MaxRequestWorkers 24
            MaxConnectionsPerChild 1000
          </IfModule>
          <IfModule mpm_prefork_module>
            MaxRequestWorkers 24
            MaxConnectionsPerChild 1000
          </IfModule>
      notify: Reload Apache

    - name: Bật module proxy và site Meko
      ansible.builtin.shell: |
        set -eu
        a2enmod proxy proxy_http reqtimeout >/dev/null
        a2enmod evasive >/dev/null
        a2enconf meko-limits >/dev/null
        a2enconf meko-evasive >/dev/null
        a2dissite 000-default >/dev/null 2>&1 || true
        a2ensite 000-meko-boutique >/dev/null
      args:
        executable: /bin/sh
      changed_when: false
      notify: Reload Apache

    - name: Áp dụng systemd drop-in của Apache
      ansible.builtin.systemd:
        name: apache2
        daemon_reload: true
      changed_when: false

    - name: Kiểm tra cấu hình Apache
      ansible.builtin.command: apache2ctl configtest
      changed_when: false

    - name: Bật và khởi động dịch vụ web
      ansible.builtin.systemd:
        name: meko-boutique
        daemon_reload: true
        enabled: true
        state: started

    - name: Bật dịch vụ Apache
      ansible.builtin.systemd:
        name: apache2
        enabled: true
        state: started

    - name: Áp dụng restart trước khi kiểm tra health
      ansible.builtin.meta: flush_handlers

    - name: Kiểm tra health cục bộ qua Apache
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        return_content: true
        use_proxy: false
      register: meko_health
      until: meko_health.status | default(0) == 200
      retries: 12
      delay: 2

    - name: Yêu cầu health trả đúng danh tính đội
      ansible.builtin.assert:
        that:
          - meko_health.json.status == 'ok'
          - meko_health.json.team == inventory_hostname

    - name: Cài desktop cho CyberRange Open GUI
      ansible.builtin.include_tasks: desktop.yml
      when: meko_desktop_enabled | bool

  handlers:
    - name: Restart Fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        daemon_reload: true
        state: restarted
    - name: Restart Apache
      ansible.builtin.systemd:
        name: apache2
        daemon_reload: true
        state: restarted
    - name: Restart Meko Boutique
      ansible.builtin.systemd:
        name: meko-boutique
        daemon_reload: true
        state: restarted
    - name: Reload Apache
      ansible.builtin.systemd:
        name: apache2
        state: reloaded
    - name: Reload SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded

- name: Kiểm tra kết nối HTTP chéo đội
  hosts: 'team1:team2:team3'
  become: true
  gather_facts: false
  tasks:
    - name: Mở health của mọi đội trên LAN
      ansible.builtin.uri:
        url: 'http://{{ item.value }}/health'
        return_content: true
        use_proxy: false
      loop: "{{ meko_addresses | dict2items }}"
      register: meko_peer
      until: meko_peer.status | default(0) == 200
      retries: 6
      delay: 2

    - name: Yêu cầu mỗi phản hồi nhận đúng danh tính đội
      ansible.builtin.assert:
        that:
          - item.json.team == item.item.key
      loop: "{{ meko_peer.results }}"

- name: Cài agent trên máy checker
  hosts: checker
  become: true
  gather_facts: false
  tasks:
    - name: Cài Python cho agent
      ansible.builtin.apt:
        name: [python3]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Tạo thư mục agent
      ansible.builtin.file:
        path: /opt/meko-checker
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Chép agent và logic checker
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../checker/{{ item }}'
        dest: '/opt/meko-checker/{{ item }}'
        owner: root
        group: root
        mode: '0644'
      loop: [agent.py, forcad.py, meko_checker.py]

    - name: Tạo thư mục cấu hình được bảo vệ
      ansible.builtin.file:
        path: /etc/meko-checker
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Ghi địa chỉ và mật khẩu nhân viên của từng đội
      ansible.builtin.template:
        src: checker-config.json.j2
        dest: /etc/meko-checker/config.json
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Chạy thử agent với từng đội
      ansible.builtin.command:
        argv: [/usr/bin/python3, /opt/meko-checker/agent.py, --config, /etc/meko-checker/config.json]
        # Khoảng trắng đầu chuỗi giữ nguyên JSON; không có nó Ansible đổi chuỗi thành dict Python.
        stdin: ' {"task": "backup", "action": "check", "ip": "{{ item.value }}"}'
      loop: "{{ meko_addresses | dict2items }}"
      register: meko_agent
      changed_when: false

    - name: Yêu cầu mọi đội trả UP
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json).status == 101
        fail_msg: "{{ item.item.key }} ({{ item.item.value }}): {{ item.stdout }} {{ item.stderr }}"
        quiet: true
      loop: "{{ meko_agent.results }}"
      loop_control:
        label: "{{ item.item.key }}"

- ansible.builtin.import_playbook: round2.yml
